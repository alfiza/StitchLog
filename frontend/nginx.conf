server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 30m;  # several phone photos at once

    # API and uploaded photos are served by the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        proxy_pass http://backend:8000;
        expires 30d;
    }

    # Built JS/CSS have hashed names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Admin and private job pages must never appear in Google
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri /index.html;
    }
}
